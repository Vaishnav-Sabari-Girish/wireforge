name: Generate Changelog

on:
  push:
      branches: [ "main" ]
      tags:
          - "v*"
  workflow_dispatch:

# We need to give the bot permission to push commits to your repo
permissions:
  contents: write

# Serialize runs so rapid pushes don't race on the final commit
concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      # wireforge is the only tagged project: its tags look like `v0.7.0`
      - name: Generate a changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag-pattern '^v[0-9]'
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push changes
        run: |
          # Set up the GitHub Actions bot git identity
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Add the updated file
          git add CHANGELOG.md

          # Commit the changes (the || exit 0 prevents the workflow from failing if there are no changes)
          git commit -m "chore(changelog): update CHANGELOG.md [skip ci]" || exit 0

          # Push the commit back to the branch
          git push origin HEAD:main || true
