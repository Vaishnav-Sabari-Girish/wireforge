name: Generate Changelog

on:
  push:
      branches: [ "main" ]
      tags:
          - "wireforge-v*"
          - "wrfm-v*"
          - "wrfm-cli-v*"
          - "wrfm-raster-v*"
  workflow_dispatch:

# We need to give the bot permission to push commits to your repo
permissions:
  contents: write

# Serialize runs so rapid pushes don't race on the final commit
concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-changelog:
    name: Update CHANGELOG.md files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      # wireforge (root package) — versioned by its own tags: wireforge-v*
      # Commits that only touch crates/** belong to the sub-crates, not to wireforge
      - name: Generate wireforge changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff-wireforge
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag-pattern '^wireforge-v[0-9]'
            --exclude-path 'crates/**'
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # crates/wrfm — versioned by its own tags: wrfm-v*
      - name: Generate wrfm changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff-wrfm
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag-pattern '^wrfm-v[0-9]'
            --include-path 'crates/wrfm/**'
        env:
          OUTPUT: crates/wrfm/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # crates/wrfm-cli — versioned by its own tags: wrfm-cli-v*
      - name: Generate wrfm-cli changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff-wrfm-cli
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag-pattern '^wrfm-cli-v[0-9]'
            --include-path 'crates/wrfm-cli/**'
        env:
          OUTPUT: crates/wrfm-cli/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      # crates/wrfm-raster — versioned by its own tags: wrfm-raster-v*
      - name: Generate wrfm-raster changelog
        uses: orhun/git-cliff-action@main
        id: git-cliff-wrfm-raster
        with:
          config: cliff.toml
          args: >-
            --verbose
            --tag-pattern '^wrfm-raster-v[0-9]'
            --include-path 'crates/wrfm-raster/**'
        env:
          OUTPUT: crates/wrfm-raster/CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit and push changes
        run: |
          # Set up the GitHub Actions bot git identity
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Add the updated files
          git add CHANGELOG.md crates/wrfm/CHANGELOG.md crates/wrfm-cli/CHANGELOG.md crates/wrfm-raster/CHANGELOG.md

          # Commit the changes (the || exit 0 prevents the workflow from failing if there are no changes)
          git commit -m "chore(changelog): update CHANGELOG.md files [skip ci]" || exit 0

          # Push the commit back to the branch
          git push origin HEAD:main || true
