[package]
name = "wireforge"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "TUI based viewer for braille-based 3D wireframes"
readme = "README.md"
authors = ["lenitain <xt.zhu@qq.com>"]
homepage = "https://github.com/lenitain/wireforge"
repository = "https://github.com/lenitain/wireforge"
keywords = ["cli", "tui", "file"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.1"
ratatui-wireframe = "0.7.0"
rayon = "1.10"
wrfm = { version = "0.4.0", path = "crates/wrfm" }

[dev-dependencies]
libc = "0.2"

[features]
default = []

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11", default-features = false }
