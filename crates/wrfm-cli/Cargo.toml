[package]
name = "wrfm-cli"
version = "0.1.0"
edition.workspace = true
description = "Streaming command-line tool for .wrfm 3D wireframe models"
readme = "README.md"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["wrfm", "3d", "wireframe", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap.workspace = true
serde_json = "1"
wrfm.workspace = true
wrfm-raster.workspace = true

[lints.rust]
unsafe_code = "forbid"

# The tool is invoked as `wrfm <subcommand>`, so the installed binary is named
# `wrfm` while the crates.io package stays `wrfm-cli`.
[[bin]]
name = "wrfm"
path = "src/main.rs"
