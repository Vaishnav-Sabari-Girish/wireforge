[package]
name = "wrfm-cli"
version = "0.1.0"
edition.workspace = true
description = "Command-line tool for .wrfm 3D wireframe models over streams"
readme = "README.md"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords = ["wrfm", "3d", "wireframe", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap.workspace = true
serde_json = "1"
wrfm.workspace = true
wrfm-raster.workspace = true

[lints.rust]
unsafe_code = "forbid"

# The tool is invoked as `wrfm <subcommand>` (docs/PLAN.md), so the installed
# binary is named `wrfm`, not `wrfm-cli`.
[[bin]]
name = "wrfm"
path = "src/main.rs"
